<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>イントロクイズ 出題者</title>
<style>
:root{
  --bg:#0d1130; --bg2:#161c47; --ink:#fdfde8; --mute:#8d93c4; --accent:#ffd23f;
  --ok:#2fd27a; --ng:#ff5d6c; --radius:22px;
  --display:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 50% 40%,var(--bg2),var(--bg));color:var(--ink);font-family:var(--display);overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0}
header{display:flex;align-items:center;gap:20px;padding:16px 28px;min-height:84px}
.counter{font-size:20px;color:var(--mute);letter-spacing:.08em}
.counter b{color:var(--ink);font-size:30px;margin:0 4px}
.chip{padding:8px 18px;border-radius:999px;background:#ffffff14;font-size:18px;letter-spacing:.06em}
.chip.live{background:var(--accent);color:#1b1b2e;font-weight:700}
.chip.stop{background:var(--ng);color:#fff;font-weight:700}
.chip.ans{background:var(--ok);color:#06251a;font-weight:700}
.join{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:14px;color:var(--mute);text-align:right}
.join .url{font-size:16px;color:var(--ink);word-break:break-all;max-width:300px}
.join canvas,.join img{width:68px;height:68px;border-radius:8px;background:#fff;padding:4px}
main{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;padding:8px 28px;gap:22px}
.grid{display:grid;grid-template-columns:repeat(var(--c,4),minmax(0,1fr));gap:22px;width:min(1000px,100%,max(300px,calc(var(--c,4)*(100vh - 372px)/var(--r,2) + (var(--c,4) - 1)*22px)))}
.tile{position:relative;aspect-ratio:1;border-radius:var(--radius);overflow:hidden;background:#000;box-shadow:0 8px 24px #0006}
.tile img{width:100%;height:100%;display:block}
.tile .conn{position:absolute;right:8px;bottom:8px;background:#000a;border-radius:999px;padding:2px 10px;font-size:14px}
.grid .tile.none{opacity:.28}
.msg{font-size:26px;color:var(--mute);letter-spacing:.06em;text-align:center}
.eq{display:flex;gap:6px;align-items:flex-end;height:44px}
.eq i{width:8px;background:var(--accent);border-radius:3px;animation:eq 0.9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.2s}.eq i:nth-child(3){animation-delay:-.5s}.eq i:nth-child(4){animation-delay:-.1s}.eq i:nth-child(5){animation-delay:-.7s}
@keyframes eq{0%,100%{height:8px}50%{height:44px}}
.bar{width:min(520px,70vw);height:6px;border-radius:3px;background:#ffffff1c;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
/* 回答中ステージ */
.hero{position:relative;width:min(46vh,420px);aspect-ratio:1;border-radius:34px;overflow:hidden;box-shadow:0 0 0 6px var(--accent),0 20px 60px #000a;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.hero img{width:100%;height:100%;display:block}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.rank{font-size:34px;font-weight:700;letter-spacing:.06em}
.rank small{font-size:20px;color:var(--mute);font-weight:400;margin-left:10px}
.strip{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.strip .tile{width:min(9vw,92px);box-shadow:none}
.strip .tile.none{opacity:.22}
.strip .tile.cur{outline:4px solid var(--accent);outline-offset:3px}
.strip .tile.wrong{opacity:.4;filter:grayscale(.7)}
.strip .tile .b{position:absolute;left:6px;top:6px;min-width:26px;height:26px;border-radius:13px;background:#000b;display:grid;place-items:center;font-size:15px;padding:0 6px}
.strip .tile.wrong .b{background:var(--ng)}
.allwrong{font-size:44px;font-weight:700;color:var(--ng)}
/* 正解 */
.answer{display:flex;align-items:center;gap:40px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.answer>img{width:min(46vh,420px);aspect-ratio:1;border-radius:14px;box-shadow:0 20px 60px #000a;object-fit:cover}
.answer .t{font-size:clamp(40px,6vw,84px);font-weight:700;line-height:1.1}
.answer .a{font-size:clamp(22px,2.6vw,36px);color:var(--mute);margin-top:12px}
.answer .w{display:flex;align-items:center;gap:14px;margin-top:26px}
.answer .w .tile{width:84px}
.answer .w span{font-size:22px}
footer{display:flex;gap:14px;justify-content:center;padding:18px 28px 26px;flex-wrap:wrap}
.btn{padding:16px 34px;border-radius:16px;font-size:22px;font-weight:700;background:#ffffff1a;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.main{background:var(--accent);color:#1b1b2e}
.btn.ok{background:var(--ok);color:#06251a}
.btn.ng{background:var(--ng);color:#fff}
.btn small{font-weight:400;opacity:.65;font-size:13px;margin-left:8px}
.btn[hidden]{display:none}
[hidden]{display:none!important}
#unlock{position:fixed;inset:0;background:#0d1130f2;display:grid;place-items:center;z-index:9;text-align:center}
#unlock button{background:var(--accent);color:#1b1b2e;font-size:30px;font-weight:700;padding:26px 56px;border-radius:22px}
#unlock p{color:var(--mute);margin-top:18px}
@media (max-width:760px){.grid{gap:10px}.join{display:none}.answer{flex-direction:column;gap:18px;text-align:center}}
@media (prefers-reduced-motion:reduce){.eq i,.hero,.answer{animation:none}}

.tile .sc{position:absolute;left:8px;top:8px;background:#000a;border-radius:999px;padding:2px 10px;font-size:15px;color:var(--accent)}
.join .pw{font-size:34px;color:var(--accent);font-weight:700;letter-spacing:.04em;word-break:break-all;max-width:260px}
.join .pw small{display:block;font-size:12px;color:var(--mute);font-weight:400;letter-spacing:0}
.join button{background:#ffffff14;border-radius:10px;padding:6px 10px;font-size:12px;color:var(--mute);margin-top:6px}
.board{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.board .it{display:flex;flex-direction:column;align-items:center;gap:6px}
.board .tile{width:min(8vw,72px);box-shadow:none}
.board .it b{font-size:20px;color:var(--accent)}
.board .adj{display:flex;gap:4px}
.board .adj button{background:#ffffff22;border-radius:8px;width:30px;height:26px;font-size:16px;line-height:1}
.board.top .tile.win{outline:4px solid var(--accent);outline-offset:3px}
.rank-list{display:flex;flex-direction:column;gap:6px;width:min(560px,92vw)}
.rank-list .row{display:flex;align-items:center;gap:16px;background:#ffffff12;border-radius:16px;padding:5px 18px 5px 5px}
.rank-list .row .tile{width:48px;border-radius:14px;box-shadow:none}
.rank-list .row .n{font-size:26px;width:56px;text-align:center;font-weight:700;color:var(--mute)}
.rank-list .row.first{background:var(--accent);color:#1b1b2e}.rank-list .row.first .n{color:#1b1b2e}
.rank-list .row .nm{flex:1;font-size:21px}.rank-list .row .pt{font-size:26px;font-weight:700}
h2.fin{margin:0;font-size:clamp(32px,5vw,56px);letter-spacing:.08em}
/* 部屋づくり */
#setup{position:fixed;inset:0;z-index:8;overflow:auto;background:radial-gradient(1200px 700px at 50% 30%,var(--bg2),var(--bg));display:flex;justify-content:center;padding:28px 16px}
#setup .box{width:min(560px,100%);align-self:flex-start}
#setup h1{font-size:30px;margin:10px 0 4px;letter-spacing:.04em}
#setup p.lead{color:var(--mute);margin:0 0 22px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{flex:1;padding:12px;border-radius:14px;background:#ffffff12;font-size:16px;color:var(--mute)}
.tabs button.on{background:var(--accent);color:#1b1b2e;font-weight:700}
.f{margin-bottom:18px}
.f label{display:block;font-size:15px;margin-bottom:6px}
.f label small{color:var(--mute);margin-left:6px;font-weight:400}
.f input[type=text],.f input[type=password],.f input[type=number]{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid #ffffff26;background:#0007;color:var(--ink)}
.f input:focus{outline:none;border-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{width:48px;height:48px;border-radius:12px;background:#ffffff14;font-size:20px;font-weight:700}
.seg button.on{background:var(--accent);color:#1b1b2e}
.step{display:flex;align-items:center;gap:14px}
.step button{width:48px;height:48px;border-radius:12px;background:#ffffff18;font-size:24px}
.step b{font-size:28px;min-width:48px;text-align:center}
.step span{color:var(--mute);font-size:14px}
.chk{display:flex;gap:10px;align-items:center;font-size:16px}
.chk input{width:22px;height:22px}
.err{color:var(--ng);min-height:24px;margin:8px 0}
#setup .go{width:100%;padding:18px;border-radius:16px;background:var(--accent);color:#1b1b2e;font-size:22px;font-weight:700}
.hint{color:var(--mute);font-size:13px;margin-top:6px}
</style>
</head>
<body>
<div id="setup"><div class="box">
  <h1>イントロクイズ 出題者</h1>
  <p class="lead">部屋を作ると、4桁の「部屋番号」とQRコードが出ます。参加者はそのどちらかで入れます。</p>
  <form id="fNew" autocomplete="off">
    <div class="f"><label>チーム数</label><div class="seg" id="segN"></div></div>
    <div class="f"><label>1チームの参加台数<small>スマホが何台まで入れるか</small></label>
      <div class="step"><button type="button" id="capM">−</button><b id="capV">1</b><button type="button" id="capP">＋</button><span>台まで</span></div></div>
    <div class="f"><label class="chk"><input type="checkbox" id="nShuf" checked>曲をランダムな順番で出す</label></div>
    <div class="f" id="keyRow" hidden><label>部屋作成の合言葉<small>公開サーバーの管理用（HOST_KEYに設定したもの）</small></label><input type="password" id="nKey"></div>
    <div class="err" id="eNew"></div>
    <button class="go" type="submit">部屋を作る</button>
  </form>
</div></div>
<div id="unlock" hidden><div><button id="unlockBtn">クリックして開始</button><p>音を出すために、最初に1回だけクリックしてください</p></div></div>
<header>
  <div class="counter">第<b id="no">1</b>問 / <span id="total">1</span></div>
  <div class="chip" id="chip">待機中</div>
  <div class="join"><div><div class="pw" id="pw"><small>部屋番号</small><span id="pwv"></span></div><div class="url" id="url"></div><button id="bResultsOpen">結果ページ</button> <button id="bResultsCopy">リンクをコピー</button> <button id="bClose">部屋を閉じる</button></div><div id="qr"></div></div>
</header>
<main id="stage"></main>
<footer id="ctl">
  <button class="btn" id="bPrev">◀ 前の曲</button>
  <button class="btn main" id="bStart">▶ スタート<small>Space</small></button>
  <button class="btn ok" id="bOk" hidden>正解 ○<small>O</small></button>
  <button class="btn ng" id="bNg" hidden>不正解 ×<small>X</small></button>
  <button class="btn" id="bResume" hidden>♪ 続きを再生</button>
  <button class="btn" id="bReveal" hidden>答えを見る</button>
  <button class="btn" id="bChorus" hidden>♪ もう一度サビ</button>
  <button class="btn main" id="bNext" hidden>次の曲 ▶▶<small>Space</small></button>
  <button class="btn" id="bNext2">次の曲 ▶</button>
  <button class="btn" id="bFinish" hidden>終了して結果へ</button>
  <button class="btn" id="bReset" hidden>リセット</button>
  <button class="btn main" id="bAgain" hidden>もう一度最初から</button>
</footer>
<script src="qrcode.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let cfg,songs=[],R=null,S=null,es=null,teamBy={},teams=[],intro=new Audio(),chorus=new Audio(),prev={},capV=1,nSel=8,resultsUrl='',ac=null;
const REASON={key:'部屋作成の合言葉が違います',room_len:'参加者用パスワードは3〜32文字にしてください',host_len:'出題者用パスワードは3〜32文字にしてください',same:'参加者用と出題者用は別のパスワードにしてください',exists:'そのパスワードの部屋は既にあります。別のパスワードにしてください',full:'部屋が多すぎます。しばらくしてからにしてください',nosongs:'曲が登録されていません',wait:'失敗が続いたため、少し待ってからやりなおしてください',bad:'入力を確認してください'};
const tileHTML=(t,cls='',inner='')=>`<div class="tile ${cls}"><img src="${t.icon}" alt="${t.name}">${inner}</div>`;

/* ---------- 部屋づくり ---------- */
function drawSeg(){$('segN').innerHTML=[2,3,4,5,6,7,8].map(n=>`<button type="button" data-n="${n}" class="${n===nSel?'on':''}">${n}</button>`).join('');}
$('segN').onclick=e=>{const b=e.target.closest('button');if(b){nSel=+b.dataset.n;drawSeg();}};
$('capM').onclick=()=>{capV=Math.max(1,capV-1);$('capV').textContent=capV;};
$('capP').onclick=()=>{capV=Math.min(30,capV+1);$('capV').textContent=capV;};
async function jpost(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json().catch(()=>({ok:false}));}
$('fNew').onsubmit=async e=>{
  e.preventDefault();$('eNew').textContent='';
  const res=await jpost('/api/create',{n:nSel,cap:capV,shuffle:$('nShuf').checked,key:$('nKey').value});
  if(!res.ok){$('eNew').textContent=REASON[res.reason]||'作成できませんでした';return;}
  enter(res.room,res.hostpw);
};
async function enter(room,hostpw){
  R={room,hostpw}; ls.set('quizHost',JSON.stringify(R));
  const sr=await (await fetch(`/api/songs?room=${encodeURIComponent(room)}&hostpw=${encodeURIComponent(hostpw)}`)).json();
  songs=sr.songs||[];
  $('setup').hidden=true; $('unlock').hidden=false;
  const isLocal=['localhost','127.0.0.1'].includes(location.hostname)||/^192\.168\.|^10\./.test(location.hostname);
  const base=(isLocal&&cfg.urls[0])||location.origin+'/';
  const u=base+'play.html?r='+encodeURIComponent(room);
  $('pwv').textContent=room;resultsUrl=location.origin+'/results.html?r='+encodeURIComponent(room)+'&k='+encodeURIComponent(hostpw); $('url').textContent=base.replace(/^https?:\/\//,'');
  $('qr').innerHTML='';
  try{const q=qrcode(0,'M');q.addData(u);q.make();$('qr').innerHTML=q.createImgTag(4,0);}catch(e){}
  intro.preload=chorus.preload='auto';
  if(es)es.close();
  es=new EventSource(`/api/events?room=${encodeURIComponent(room)}&hostpw=${encodeURIComponent(hostpw)}`);
  es.onmessage=ev=>{const d=JSON.parse(ev.data);if(d.closed){leaveRoom();return;}S=d;onState();};
}
function leaveRoom(){
  if(es)es.close(); intro.pause();chorus.pause(); R=null;S=null;prev={}; ls.del('quizHost'); location.reload();
}
const post=async(a,extra={})=>{
  const r=await fetch('/api/host',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room:R.room,hostpw:R.hostpw,action:a,...extra})});
  if(r.status===403)leaveRoom();
  return r;
};

async function init(){
  cfg=await (await fetch('/api/config')).json();
  cfg.teams.forEach(t=>teamBy[t.id]=t);
  $('keyRow').hidden=!cfg.needKey; $('nKey').value=ls.get('createKey');
  $('nKey').onchange=()=>ls.set('createKey',$('nKey').value);
  drawSeg();
  const saved=ls.get('quizHost');
  if(saved){try{const s=JSON.parse(saved);const res=await jpost('/api/host_login',s);if(res.ok){enter(s.room,s.hostpw);return;}}catch(e){} ls.del('quizHost');}
}

/* ---------- 音 ---------- */
function loadSong(){const s=songs[S.song];if(!s)return;intro.src=s.intro;chorus.src=s.chorus;intro.load();chorus.load();}
/* ---------- 効果音（音ファイル不要・その場で作る） ---------- */
function tone(f,t0,dur,type='sine',vol=.28,f2){
  if(!ac)return; const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t0;
  o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+dur);
  g.gain.setValueAtTime(0.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+.015);g.gain.exponentialRampToValueAtTime(0.0001,n+dur);
  o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+dur+.05);
}
const sfx={
  start(){tone(98,0,.42,'sawtooth',.22);tone(147,0,.42,'sawtooth',.14);tone(73,.45,.75,'sawtooth',.26);tone(110,.45,.75,'sawtooth',.16);},
  ok(){tone(880,0,.18,'sine',.3);tone(1318,.16,.6,'sine',.3);tone(1760,.16,.6,'sine',.08);},
  ng(){tone(160,0,.55,'sawtooth',.22,100);tone(150,0,.55,'square',.1,95);}
};
let introTimer=null,chorusTimer=null,nextTimer=null;
function audioSync(){
  if(S.song!==undefined&&prev.song!==S.song)loadSong();
  const changed=prev.phase!==S.phase||prev.run!==S.run||prev.song!==S.song;
  const wn=(S.wrong||[]).length;
  if(S.phase==='buzzed'&&prev.phase==='buzzed'&&wn>(prev.wn||0))sfx.ng();
  if(changed){
    clearTimeout(introTimer);clearTimeout(chorusTimer);clearTimeout(nextTimer);
    if(S.phase==='playing'){
      chorus.pause();intro.pause();intro.currentTime=0;sfx.start();
      const run=S.run;introTimer=setTimeout(()=>{if(S&&S.phase==='playing'&&S.run===run)intro.play().catch(()=>{});},S.delay||1200);
    }
    else if(S.phase==='buzzed'){intro.pause();chorus.pause();}
    else if(S.phase==='answer'){
      intro.pause();chorus.pause();chorus.currentTime=0;
      if(S.winner){sfx.ok();chorusTimer=setTimeout(()=>{if(S&&S.phase==='answer')chorus.play().catch(()=>{});},900);}
      else chorus.play().catch(()=>{});
    }
    else{intro.pause();chorus.pause();}
  }
  prev={phase:S.phase,run:S.run,song:S.song,wn};
}
chorus.onended=()=>{
  const pos=S&&S.pos;clearTimeout(nextTimer);
  nextTimer=setTimeout(()=>{if(S&&R&&S.phase==='answer'&&S.pos===pos)post('next',{from:pos});},1800);
};
function onState(){audioSync();render();}

/* ---------- 表示 ---------- */
function render(){
  teams=S.teams.map(id=>teamBy[id]);
  const n=teams.length,c=n<=4?n:(n<=6?3:4),r=Math.ceil(n/c);
  document.documentElement.style.setProperty('--c',c);document.documentElement.style.setProperty('--r',r);
  const ph=S.phase,order=S.order,joined=S.joined||{};
  const song=songs[S.song]||{title:'',artist:'',cover:''};
  $('no').textContent=Math.min(S.pos+1,S.total);$('total').textContent=S.total;
  const chip=$('chip');chip.className='chip';
  chip.textContent={ready:'待機中',playing:'♪ 再生中',buzzed:'早押し！',answer:'正解発表',finished:'終了'}[ph];
  if(ph==='playing')chip.classList.add('live');if(ph==='buzzed')chip.classList.add('stop');if(ph==='answer'||ph==='finished')chip.classList.add('ans');
  const st=$('stage');
    if(ph==='ready'||ph==='playing'){
    const grid='<div class="grid">'+teams.map(t=>{const j=joined[t.id]||0;return tileHTML(t,j?'':'none',`<span class="conn">${j}/${S.cap}台</span>`);}).join('')+'</div>';
    const info=ph==='playing'
      ?'<div class="eq"><i></i><i></i><i></i><i></i><i></i></div><div class="bar"><i id="prog"></i></div>'
      :'<div class="msg">スタートを押すとイントロが流れます</div>';
    st.innerHTML=grid+info;
  }else if(ph==='buzzed'){
    const cur=S.cur,strip='<div class="strip">'+teams.map(t=>{
      const i=order.findIndex(o=>o.team===t.id),isW=S.wrong.includes(t.id);
      return tileHTML(t,(i<0?'none ':'')+(isW?'wrong ':'')+(i===cur?'cur':''),i>=0?`<span class="b">${isW?'×':i+1}</span>`:'');
    }).join('')+'</div>';
    if(cur<order.length){
      const o=order[cur],d=cur>0?`<small>最速より +${((o.ms-order[0].ms)/1000).toFixed(2)}秒</small>`:'';
      st.innerHTML=`<div class="hero"><img src="${teamBy[o.team].icon}" alt=""></div><div class="rank">${cur+1}位${d}</div>`+strip;
    }else st.innerHTML=`<div class="allwrong">全チーム不正解…</div>`+strip;
  }else if(ph==='answer'){
    const w=S.winner?teamBy[S.winner]:null;
    st.innerHTML=`<div class="answer"><img src="${song.cover}" alt=""><div><div class="t">${esc(song.title)}</div><div class="a">${esc(song.artist)}</div>`+
      (w?`<div class="w">${tileHTML(w)}<span>${w.name} 正解！</span></div>`:'')+`</div></div>`;
  }else{
    st.innerHTML=`<h2 class="fin">全問終了！</h2><div class="msg">おつかれさまでした<br>結果は「結果ページ」で確認できます</div>`;
  }
  const last=S.pos===S.total-1,fin=ph==='finished';
  const show={bPrev:ph==='ready'&&S.pos>0,bStart:ph==='ready',bNext2:ph==='ready'&&S.total>1,
    bOk:ph==='buzzed'&&S.cur<order.length,bNg:ph==='buzzed'&&S.cur<order.length,
    bResume:ph==='buzzed',bReveal:ph==='playing'||(ph==='buzzed'&&S.cur>=order.length),
    bChorus:ph==='answer',bNext:ph==='answer',bReset:ph==='playing'||ph==='buzzed'||ph==='answer',
    bFinish:ph==='ready'||ph==='answer',bAgain:fin};
  for(const k in show)$(k).hidden=!show[k];
  $('bNext').innerHTML=(last?'結果発表へ ▶▶':'次の曲 ▶▶')+'<small>Space</small>';
  $('bNext2').textContent=last?'結果発表へ ▶':'この曲を飛ばす ▶';
}
setInterval(()=>{const p=$('prog');if(p&&intro.duration)p.style.width=Math.min(100,intro.currentTime/intro.duration*100)+'%';},100);

$('bStart').onclick=()=>post('start');
$('bPrev').onclick=()=>post('prev');
$('bNext2').onclick=()=>post('next');
$('bNext').onclick=()=>post('next');
$('bOk').onclick=()=>post('correct');
$('bNg').onclick=()=>post('wrong');
$('bReveal').onclick=()=>post('reveal');
$('bReset').onclick=()=>post('reset');
$('bAgain').onclick=()=>{if(confirm('得点も記録もリセットして、最初からやりなおします。先に結果ページでCSVを保存しましたか？'))post('restart');};
$('bFinish').onclick=()=>{if(confirm('ここで終了して結果発表にしますか？'))post('finish');};
$('bClose').onclick=()=>{if(confirm('この部屋を閉じますか？参加者の画面も終了します。'))post('close').then(leaveRoom);};
$('bResultsOpen').onclick=()=>window.open(resultsUrl,'_blank');
$('bResultsCopy').onclick=async()=>{const b=$('bResultsCopy');try{await navigator.clipboard.writeText(resultsUrl);b.textContent='コピーしました';}catch(e){prompt('このリンクをコピーしてください',resultsUrl);}setTimeout(()=>b.textContent='リンクをコピー',1800);};
$('bResume').onclick=()=>intro.play().catch(()=>{});
$('bChorus').onclick=()=>{chorus.currentTime=0;chorus.play().catch(()=>{});};
$('unlockBtn').onclick=()=>{
  try{ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume();}catch(e){}
  [intro,chorus].forEach(a=>{a.muted=true;a.play().then(()=>{a.pause();a.currentTime=0;a.muted=false;}).catch(()=>{a.muted=false;});});
  $('unlock').hidden=true;
};
addEventListener('keydown',e=>{
  if(!S||!R||e.repeat||/INPUT|TEXTAREA/.test((e.target||{}).tagName||''))return;
  const k=e.key.toLowerCase();
  if(e.key===' '){e.preventDefault();if(S.phase==='ready')post('start');else if(S.phase==='answer')post('next');}
  else if(k==='o'&&S.phase==='buzzed')post('correct');
  else if(k==='x'&&S.phase==='buzzed')post('wrong');
});
init();
</script>
</body>
</html>
